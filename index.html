<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>collaborative-coffee-page</title>
  </head>
  <body>
    <link rel="stylesheet" href="style.css" />
    <header class="header">
      <div class="container">
        <div class="logo">
          <span class="logo-text">IMAJI</span>
          <span class="logo-subtext">Coffee.</span>
        </div>
        <nav class="nav">
          <a class="nav-link">Home</a>
          <a class="nav-link">Story</a>
          <a class="nav-link">Menu</a>
          <a class="nav-link">Space</a>
          <a class="nav-link">Community</a>
          <a class="nav-link">News</a>
        </nav>
        <div class="header-actions">
          <button class="order-btn">Order</button>
          <button class="signin-btn">Sign In</button>
        </div>
      </div>
    </header>
    <section>
      <div class="body-section">
        <div class="body-text">
          <h1 class="body-title">A collaborative coffee experience</h1>
          <p class="body-subtitle">
            Discover the art of coffee with us. From bean to cup, we bring
            people together to share in the joy of exceptional coffee.
          </p>
        </div>
        <div class="body-image">
          <img src="https://images.pexels.com/photos/312418/pexels-photo-312418.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500" alt="Coffee Cup" />
        </div>
      </div>
    </section>
  </body>
</html>
